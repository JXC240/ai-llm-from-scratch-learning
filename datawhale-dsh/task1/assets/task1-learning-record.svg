<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 4026" width="1600" height="4026" font-family="Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif"><rect width="100%" height="100%" fill="#F5F3EE"/><rect x="0" y="0" width="1600" height="505" fill="#142C3A"/><rect x="100" y="72" width="8" height="42" fill="#5FD0B5"/><text x="132" y="103" font-size="35" font-weight="600" fill="#B5D9D0">DATAWHALE  /  DSH  /  TASK 01</text><text x="100" y="235" font-size="98" font-weight="600" fill="#FFFFFF">模型会输出，</text><text x="100" y="363" font-size="98" font-weight="600" fill="#FFFFFF">任务如何完成？</text><text x="100" y="453" font-size="35" font-weight="400" fill="#BBD0D6">导读与第1章学习记录   ·   2026.10.15</text><text x="100" y="596" font-size="31" font-weight="600" fill="#117D77">一个贯穿场景</text><text x="100" y="669" font-size="48" font-weight="600" fill="#253E49">读取论文 → 提取指定数据 → 生成表格</text><text x="100" y="727" font-size="31" font-weight="400" fill="#60727A">用具体任务理解架构；本图为学习整理，场景尚未开发为实际 Agent。</text><polyline points="100,784 1500,784" fill="none" stroke="#D3DCD8" stroke-width="2"/><text x="100" y="839" font-size="35" font-weight="600" fill="#117D77">01</text><text x="184" y="847" font-size="50" font-weight="600" fill="#142C3A">Runtime 与 Agent Loop，各负责什么？</text><rect x="100" y="898" width="1400" height="345" rx="24" fill="#FFFFFF" stroke="#D3DCD8" stroke-width="2"/><text x="136" y="958" font-size="40" font-weight="600" fill="#142C3A">Runtime：连接与管理运行能力</text><text x="136" y="1014" font-size="30" font-weight="400" fill="#60727A">模型适配  /  工具  /  会话  /  权限  /  插件生命周期</text><rect x="145" y="1055" width="380" height="90" rx="24" fill="#E6F0EA" stroke="none" stroke-width="2"/><text x="183" y="1109" font-size="35" font-weight="600" fill="#142C3A">模型生成请求</text><rect x="610" y="1055" width="380" height="90" rx="24" fill="#E6F0EA" stroke="none" stroke-width="2"/><text x="648" y="1109" font-size="35" font-weight="600" fill="#142C3A">工具实际执行</text><rect x="1075" y="1055" width="380" height="90" rx="24" fill="#E6F0EA" stroke="none" stroke-width="2"/><text x="1113" y="1109" font-size="35" font-weight="600" fill="#142C3A">结果交回模型</text><polyline points="535,1099 588,1099" fill="none" stroke="#117D77" stroke-width="5"/><polygon points="600,1099 583,1089 583,1109" fill="#117D77"/><polyline points="1000,1099 1053,1099" fill="none" stroke="#117D77" stroke-width="5"/><polygon points="1065,1099 1048,1089 1048,1109" fill="#117D77"/><polyline points="1265,1155 1265,1188 335,1188 335,1155" fill="none" stroke="#117D77" stroke-width="4"/><polygon points="335,1145 324,1163 346,1163" fill="#117D77"/><rect x="555" y="1167" width="483" height="46" rx="24" fill="#FFFFFF" stroke="none" stroke-width="2"/><text x="576" y="1193" font-size="26" font-weight="600" fill="#117D77">Agent Loop：需要时继续推进</text><text x="100" y="1305" font-size="36" font-weight="400" fill="#253E49">Runtime 支撑并组织整个运行过程；Loop 是其中推进任务的组件。</text><polyline points="100,1365 1500,1365" fill="none" stroke="#D3DCD8" stroke-width="2"/><text x="100" y="1420" font-size="35" font-weight="600" fill="#117D77">02</text><text x="184" y="1428" font-size="50" font-weight="600" fill="#142C3A">两句值得保留的认识</text><rect x="100" y="1479" width="1400" height="280" rx="24" fill="#142C3A" stroke="none" stroke-width="2"/><text x="138" y="1545" font-size="40" font-weight="600" fill="#FFFFFF">Agent Loop 本身也可以作为插件装入 Runtime。</text><polyline points="138,1590 1460,1590" fill="none" stroke="#38515D" stroke-width="2"/><text x="138" y="1655" font-size="43" font-weight="600" fill="#8FE0C7">插件化让组件更容易组合、更换，</text><text x="138" y="1716" font-size="43" font-weight="600" fill="#8FE0C7">但更换时仍要满足依赖关系。</text><text x="100" y="1823" font-size="36" font-weight="400" fill="#253E49">统一的是接入、组合与管理规则；模型、工具、会话和循环仍各有职责。</text><polyline points="100,1883 1500,1883" fill="none" stroke="#D3DCD8" stroke-width="2"/><text x="100" y="1938" font-size="35" font-weight="600" fill="#117D77">03</text><text x="184" y="1946" font-size="50" font-weight="600" fill="#142C3A">依赖能力，不绑死提供方</text><rect x="100" y="1997" width="1400" height="217" rx="24" fill="#FFFFFF" stroke="#D3DCD8" stroke-width="2"/><text x="138" y="2058" font-size="37" font-weight="600" fill="#142C3A">上层工具只要求：给定路径，返回文件内容。</text><text x="138" y="2130" font-size="37" font-weight="600" fill="#117D77">Local FS</text><text x="138" y="2177" font-size="30" font-weight="400" fill="#60727A">本地文件系统</text><text x="602" y="2130" font-size="37" font-weight="600" fill="#117D77">Remote FS</text><text x="602" y="2177" font-size="30" font-weight="400" fill="#60727A">远程文件系统</text><text x="1066" y="2130" font-size="37" font-weight="600" fill="#117D77">Container FS</text><text x="1066" y="2177" font-size="30" font-weight="400" fill="#60727A">容器内文件系统</text><text x="100" y="2278" font-size="36" font-weight="400" fill="#253E49">提供方可以更换，但输入输出、权限、路径与错误处理等约定仍须匹配。</text><polyline points="100,2338 1500,2338" fill="none" stroke="#D3DCD8" stroke-width="2"/><text x="100" y="2393" font-size="35" font-weight="600" fill="#117D77">04</text><text x="184" y="2401" font-size="50" font-weight="600" fill="#142C3A">增加工具，也扩展执行机制</text><text x="100" y="2486" font-size="38" font-weight="600" fill="#253E49">工具注册让系统知道“能做什么”；扩展点参与“怎样执行”。</text><text x="112" y="2553" font-size="34" font-weight="600" fill="#117D77">A</text><text x="184" y="2555" font-size="36" font-weight="600" fill="#142C3A">执行前</text><text x="425" y="2553" font-size="34" font-weight="400" fill="#253E49">检查调用条件，决定继续、拒绝或询问。</text><text x="112" y="2621" font-size="34" font-weight="600" fill="#117D77">B</text><text x="184" y="2623" font-size="36" font-weight="600" fill="#142C3A">执行外围</text><text x="425" y="2621" font-size="34" font-weight="400" fill="#253E49">增加计时、超时等控制。</text><text x="112" y="2689" font-size="34" font-weight="600" fill="#117D77">C</text><text x="184" y="2691" font-size="36" font-weight="600" fill="#142C3A">执行之后</text><text x="425" y="2689" font-size="34" font-weight="400" fill="#253E49">整理返回结果，并衔接后续处理。</text><text x="100" y="2764" font-size="32" font-weight="400" fill="#60727A">单调防护：本次判断中的拒绝不能被其他防护强制改成允许。</text><polyline points="100,2823 1500,2823" fill="none" stroke="#D3DCD8" stroke-width="2"/><text x="100" y="2878" font-size="35" font-weight="600" fill="#117D77">05</text><text x="184" y="2886" font-size="50" font-weight="600" fill="#142C3A">我的追问：与 Codex harness 有何不同？</text><rect x="100" y="2937" width="680" height="258" rx="24" fill="#FFFFFF" stroke="#D3DCD8" stroke-width="2"/><text x="134" y="3001" font-size="43" font-weight="600" fill="#117D77">DSH</text><text x="134" y="3067" font-size="33" font-weight="400" fill="#253E49">公开架构明确：Loop、会话、工具注册</text><text x="134" y="3119" font-size="33" font-weight="400" fill="#253E49">与模型适配，也参与插件组合。</text><rect x="820" y="2937" width="680" height="258" rx="24" fill="#FFFFFF" stroke="#D3DCD8" stroke-width="2"/><text x="854" y="3001" font-size="43" font-weight="600" fill="#117D77">Codex</text><text x="854" y="3067" font-size="33" font-weight="400" fill="#253E49">提供可复用 Harness，并通过技能、外</text><text x="854" y="3119" font-size="33" font-weight="400" fill="#253E49">部工具与执行钩子等公开接口扩展。</text><text x="100" y="3253" font-size="33" font-weight="400" fill="#60727A">区别在公开的组合与扩展边界，不能据此直接判断任务效果强弱。</text><polyline points="100,3312 1500,3312" fill="none" stroke="#D3DCD8" stroke-width="2"/><text x="100" y="3367" font-size="35" font-weight="600" fill="#117D77">06</text><text x="184" y="3375" font-size="50" font-weight="600" fill="#142C3A">学习进展与下一步</text><text x="100" y="3458" font-size="36" font-weight="400" fill="#253E49">本次已做  /  截图伴读、概念追问、安装桌面版、整理笔记。</text><text x="100" y="3527" font-size="36" font-weight="400" fill="#253E49">仍需实践  /  模型配置、插件开发、实际运行与理解检验。</text><text x="100" y="3596" font-size="36" font-weight="400" fill="#253E49">版本意识  /  原理与命令分开学，操作前核对安装版本。</text><rect x="100" y="3668" width="1400" height="142" rx="24" fill="#DCEBE3" stroke="none" stroke-width="2"/><text x="138" y="3727" font-size="39" font-weight="600" fill="#142C3A">学习重点：能力怎样连接、受什么约束，</text><text x="138" y="3785" font-size="39" font-weight="600" fill="#142C3A">以及如何留下可检查的执行过程。</text><polyline points="100,3848 1500,3848" fill="none" stroke="#D3DCD8" stroke-width="2"/><text x="100" y="3897" font-size="27" font-weight="400" fill="#60727A">依据课程截图及官方架构资料整理 · AI 辅助文字与绘图 · 示例为教学假设</text><text x="100" y="3948" font-size="26" font-weight="400" fill="#60727A">资料核对：2026.10.15  ｜  本图为学习记录，不代表已完成插件开发或运行实验。</text></svg>